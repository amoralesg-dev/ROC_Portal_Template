<div class="rui-login">

    <div class="rui-login-card">

        <img
            [src]="logo"
            alt="Rassini"
            class="rui-login-logo">

        <h2>{{ title }}</h2>

        
        @if (applicationName) {

            <div class="rui-login-app-name">
                {{ applicationName }}
            </div>

        }


        <span>{{ subtitle }}</span>

        <div class="rui-login-form">

            <label>{{ usernameLabel }}</label>

            <input
                pInputText
                [(ngModel)]="username"
                placeholder="{{ usernamePlaceholder }}">

            <label>{{ passwordLabel }}</label>

            <p-password
                [(ngModel)]="password"
                [toggleMask]="true"
                [feedback]="false"
                [fluid]="true"
                placeholder="{{ passwordPlaceholder }}">
            </p-password>

            <button
                pButton
                (click)="onLogin()"
                [disabled]="!username || !password">

                {{ loading ? loadingText : loginButtonText }}

            </button>
            @if (errorMessage) {
                <small class="rui-login-error">
                    {{ errorMessage }}
                </small>
            }


        </div>

    </div>

</div>
