<div class="page-header">

    @if (icon) {
        <div class="page-header-icon">
            <i [class]="icon"></i>
        </div>
    }

    <div class="page-header-content">
        <h1>{{ title }}</h1>

        @if (subtitle) {
            <span>{{ subtitle }}</span>
        }
    </div>

</div>
